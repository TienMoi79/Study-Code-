<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Background shorthand</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    .box{
      width: 320px;
      height: 200px;

      background: url("https://picsum.photos/600/400")
                  center / contain
                  no-repeat
                  #f5f5f5;

      border: 2px dashed #999;   
      margin: 24px;
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
