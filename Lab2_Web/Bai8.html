<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bài 8 - Thẻ img</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; padding: 24px; }
    hr { margin: 20px 0; }
  </style>
</head>
<body>
  <h2>Thẻ img #1</h2>
  <p>Hiển thị ảnh theo URL được cho:</p>
  <img
    src="https://online.vlu.edu.vn/Content/logo/banner-yersin.jpg"
    alt="Banner Yersin"
  />
  <hr>
  <h2>Thẻ img #2</h2>
  <p>Hiển thị ảnh ở kích thước <strong>100 x 100</strong>:</p>
  <img
    src="https://online.vlu.edu.vn/Content/logo/banner-yersin.jpg"
    alt="Banner Yersin 100x100"
    width="100" height="100"
  >
  <hr>

  <h2>Thẻ img #3</h2>
  <p>Thêm <code>alt</code> để có nội dung thay thế là: <strong>itvlu</strong>.</p>
  <img src="https://online.vlu.edu.vn/Content/logo/khong-ton-tai.jpg" alt="itvlu">
</body>
</html>
