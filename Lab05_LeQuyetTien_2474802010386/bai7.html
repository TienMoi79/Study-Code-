<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Layout cơ bản với Flexbox</title>
  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; }
    .container { max-width: 1000px; margin: 0 auto; }

    header {
      background: #e60000;  
      color: #333;
      text-align: center;
      padding: 24px 0;
      font-size: 28px;
      font-weight: 700;
      color: #2d2d2d;
      color:#333;
    }
    nav {
      background: #ffeb3b; 
      text-align: center;
      padding: 10px 0;
      font-weight: 700;
    }
    .content {
      display: flex;
      gap: 0;               
      min-height: 420px;  
      background: #bdb077;   
    }
    aside.left {
      width: 20%;           
      background: #800080;   
      color: #222;
      display: flex; align-items: start; justify-content: center;
      padding: 12px; font-weight: 700;
      color:#2b2b2b;
    }
    main {
      flex: 1;               
      background: transparent;
      display: flex; align-items: start; justify-content: center;
      padding: 12px; font-weight: 700; color:#333;
    }
    aside.right {
      width: 15%;        
      background: #00ff1a;  
      display: flex; align-items: start; justify-content: center;
      padding: 12px; font-weight: 700; color:#2b2b2b;
    }

    footer {
      background: #ffeb3b; 
      padding: 12px 0;
      font-weight: 700;
    }
    @media (max-width: 700px) {
      .content { flex-direction: column; }
      aside.left, aside.right, main { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>header</header>

    <nav>MENU</nav>

    <section class="content">
      <aside class="left">LEFT</aside>
      <main>CENTER</main>
      <aside class="right">RIGHT</aside>
    </section>

    <footer>FOOTER</footer>
  </div>
</body>
</html>
