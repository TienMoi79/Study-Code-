<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: 'Times New Roman', Times, serif;
        }
        h2{
            margin-left: 80px;
            padding-bottom: -20px;
        }
        input{
            margin-left: 20px;
            border: rgb(24, 24, 143) solid;
        }
        button{
            background-color: #3b73c0;
            color: white;
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Đăng Nhập</h2>
    <form>
        <table>
            <tr>
                <td>Tên đăng nhập: </td>
                <td><input type="text" name="username"></td>
            </tr>
            <tr>
                <td>Mật khẩu: </td>
                <td><input type="password" name="password"></td>
            </tr>
        </table>
        <br>
        <button style="margin-left: 100px;" type="reset">Cancel</button>
        <button type="submit">Login</button>
    </form>
</body>
</html>
