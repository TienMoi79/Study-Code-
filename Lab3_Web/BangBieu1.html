<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BangBieu.html</title>
    <style>
        table {
            border: 8px solid black;
            border-collapse: separate;
            border-spacing: 3px;
            width: 400px;
            height: 600px;
            background-color: blue;
        }
        td {
            border: 1px solid black;
            text-align: right;  
            vertical-align: middle;
            font-size: 20px;
            padding: 15px;
        }     
    </style>
</head>
<body>
    <table>
        <tr style="height: 200px;">
            <td style="width: 100px;">A</td>
            <td style="width: 120px;">B</td>
            <td style="width: 180px; background-color: red;">C</td>
        </tr>
        <tr style="height: 400px;">
            <td style="width: 100px;">D</td>
            <td style="width: 120px;">E</td>
            <td style="width: 180px;">F</td>
        </tr>
    </table>
</body>
</html>
